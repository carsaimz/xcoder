android {
    packagingOptions {
        pickFirst 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
    }
}

configurations {
  all {
      exclude module: 'commons-logging'
      exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
      exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
      exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
      exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
  }
}
// ---------------------------------------------------------------------------
// Native Firebase (Analytics, Crashlytics, Remote Config, FCM)
//
// Cordova Android 15 owns the google-services plugin lifecycle itself: when
// the post-process hook flips IS_GRADLE_PLUGIN_GOOGLE_SERVICES_ENABLED in
// platforms/android/cdv-gradle-config.json, the platform adds the plugin
// classpath (com.google.gms:google-services:4.4.2) and applies it at the END
// of app/build.gradle. Do NOT re-declare buildscript{} or apply plugin here —
// a buildscript block inside a script applied with `apply from:` has an
// isolated classpath under Gradle 8, the plugin id cannot be resolved and the
// throw aborts app/build.gradle evaluation before android{} sets compileSdk.
//
// This file only adds the Firebase libraries when the hook managed to copy
// google-services.json into this app module. Builds without it
// (self-hosters, F-Droid flavour) compile normally without any Firebase
// dependency, and the F-Droid flag file (<tmpdir>/fdroid.bool) actively
// prevents the copy.
// ---------------------------------------------------------------------------
def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists()) {
    dependencies {
        implementation platform('com.google.firebase:firebase-bom:33.7.0')
        implementation 'com.google.firebase:firebase-analytics'
        implementation 'com.google.firebase:firebase-crashlytics'
        implementation 'com.google.firebase:firebase-config'
        implementation 'com.google.firebase:firebase-messaging'
    }
}
