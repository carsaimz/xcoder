android {
    packagingOptions {
        pickFirst 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
    }
}

configurations {
  all {
      exclude module: 'commons-logging'
      exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
      exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
      exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
      exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
  }
}
// ---------------------------------------------------------------------------
// Native Firebase — Analytics + Crashlytics ONLY (v1.4.11 decision)
//
// Remote Config and FCM were REMOVED: remote configuration now comes from
// the community site (/api/config, see lib/backend.js) and notifications
// are delivered by the site through the notification manager (and system
// notifications when the local-notifications plugin is installed). Auth and
// dynamic data live in Supabase on the site side.
//
// Cordova Android 15 owns the google-services plugin lifecycle itself: when
// the post-process hook flips IS_GRADLE_PLUGIN_GOOGLE_SERVICES_ENABLED in
// platforms/android/cdv-gradle-config.json, the platform adds the plugin
// classpath (com.google.gms:google-services:4.4.2) and applies it at the END
// of app/build.gradle. Do NOT re-declare buildscript{} or apply plugin here —
// a buildscript block inside a script applied with `apply from:` has an
// isolated classpath under Gradle 8, the plugin id cannot be resolved and the
// throw aborts app/build.gradle evaluation before android{} sets compileSdk.
//
// This file only adds the Firebase libraries when the hook managed to copy
// google-services.json into this app module AND the build environment opted
// in via NATIVE_FIREBASE=true (hooks/post-process.js is the gatekeeper and
// won't copy the JSON otherwise). Builds without both (default, self-hosters,
// F-Droid flavour) compile normally without any Firebase dependency; the
// F-Droid flag file (<tmpdir>/fdroid.bool) actively prevents the copy.
//
// v1.4.8 shipped these libraries for the first time and the app stopped
// booting on real devices, so native Firebase now stays OFF until the
// crash is reproduced with device logs and fixed.
//
// NOTE: the crashlytics-gradle plugin (symbol/mapping upload) is NOT applied
// here on purpose — it cannot resolve under the isolated classpath of this
// script. Crash reports still work; obfuscated stack traces would need the
// mapping file uploaded manually when R8 is enabled.
def nativeFirebaseEnabled = System.getenv('NATIVE_FIREBASE') == 'true'
def googleServicesFile = file('google-services.json')
if (nativeFirebaseEnabled && googleServicesFile.exists()) {
    dependencies {
        implementation platform('com.google.firebase:firebase-bom:33.7.0')
        implementation 'com.google.firebase:firebase-analytics'
        implementation 'com.google.firebase:firebase-crashlytics'
    }
}
