name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to **XCoder**! Thanks for opening your first issue.

            Please make sure you include:
            - the device/browser and app version,
            - steps to reproduce,
            - expected vs actual behaviour.

            Check out [CONTRIBUTING.md](https://github.com/carsaimz/xcoder/blob/main/CONTRIBUTING.md) for the conventional-commit conventions we follow.
          pr-message: |
            🎉 Welcome and thanks for your first contribution to **XCoder**!

            A maintainer will review your pull request shortly. Some tips:
            - follow [Conventional Commits](https://www.conventionalcommits.org/) (`feat:`, `fix:`, …),
            - add or update tests when applicable (`npm test`),
            - run `npm run build` locally to verify everything compiles.
