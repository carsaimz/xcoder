name: Stale

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: |
            This issue has been automatically marked as stale because it has had no
            activity for 60 days. It will be closed in 14 days if no further activity
            happens. Thank you for your contributions! 🤖
          stale-pr-message: |
            This pull request has been automatically marked as stale due to 60 days
            of inactivity. It will be closed in 14 days if no further activity happens.
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,enhancement
          exempt-pr-labels: pinned,security,work-in-progress
          exempt-all-assignees: true
