name: Renovate auto-merge

# Enables GitHub native auto-merge on Renovate PRs so they merge as soon as
# every required check (build/test) passes.
#
# Requirements on GitHub:
#   1. Settings > General > Pull Requests > check "Allow auto-merge"
#   2. Branch protection for main with the CI checks marked as REQUIRED
#      (that's what native auto-merge waits for; without required checks
#      it would merge immediately after approval rules are satisfied).
#
# Major bumps (label "dependencies-major") are never auto-merged here —
# that matches renovate.json, where majors set automerge: false.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge (squash)
    runs-on: ubuntu-latest
    if: >-
      github.actor == 'renovate[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies-major')

    steps:
      - name: Enable native auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL" && \
            echo "Auto-merge enabled — PR will merge when all required checks pass."
