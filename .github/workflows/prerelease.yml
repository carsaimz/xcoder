name: Pre-release (debug APK)

# Signed beta APK published as a GitHub pre-release for -beta/-rc
# versions (v1.2.3-beta.1, v2.0.0-rc.1, ...).
#
# MANUAL ONLY: triggered exclusively through workflow_dispatch (the user
# writes the version in the Actions UI; leaving it empty auto-increments
# to the next beta, e.g. 1.8.45-beta -> 1.8.45-beta.2). No tag/push
# triggers — a version is NEVER released twice: re-dispatching an
# existing tag fails unless «force» is ticked, which re-points the tag
# to the current HEAD and rebuilds (that is how tags used to drift and
# ship the wrong commits under an old version).
#
# Betas install SIDE BY SIDE with the stable app (never overwrite it):
#   application id  com.carsaimz.xcoder  ->  com.carsaimz.xcoder.beta
#   launcher name   XCoder               ->  XCoder Beta
#   versionName     1.8.45               ->  1.8.45-beta
#   versionCode     10845                ->  1010845 (stable + 1,000,000)
#
# CHANNELS ARE INDEPENDENT (utils/scripts/latest-channel-tag.mjs): beta
# versions are compared only against previous BETA tags, never against
# stable tags — a stable release of a higher version cannot block or
# reorder the beta series, and the beta notes range from the previous
# beta tag so stable commits never leak into them.
#
# Stable releases keep flowing through release.yml (promotion only).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release version (e.g. 1.8.46-beta). Empty = auto-increment; a version whose tag already exists auto-bumps to beta.N+1"
        required: false
        type: string
      force:
        description: "Re-point an existing tag to current HEAD and rebuild"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Prepare version (dispatch only; a tag is never reused silently)
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -e
          # latest BETA tag only — the beta channel is independent from the
          # stable channel (a stable v2.0.0 would never gate a 1.8.x beta)
          LATEST=$(node utils/scripts/latest-channel-tag.mjs --beta || true)
          if [ -z "$INPUT_VERSION" ]; then
            # empty input = auto-increment (1.8.45-beta -> 1.8.45-beta.2,
            # always strictly above the latest tag)
            OUT=$(node utils/scripts/bump-version.mjs --next-beta ${LATEST:+--latest "$LATEST"})
            VERSION=$(printf '%s' "$OUT" | sed -n 's/^version=//p')
          else
            case "$INPUT_VERSION" in
              *-beta*|*-rc*) ;;
              *) echo "::error::Pre-release version must contain -beta or -rc (e.g. 1.4.0-beta.1)"; exit 1 ;;
            esac
            VERSION=$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]' | sed 's/^v//')
          fi
          # a version that already ships as a tag is NEVER rebuilt under the
          # same name: an explicit input whose tag exists auto-bumps to the
          # next free beta (1.8.46-beta -> 1.8.46-beta.2 -> 1.8.46-beta.3…)
          # so a repeat dispatch at least produces «beta2»; only an explicit
          # «force» re-points the tag to the current HEAD and rebuilds
          if [ "$FORCE" != "true" ]; then
            TRIES=0
            while git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; do
              TRIES=$((TRIES + 1))
              if [ "$TRIES" -gt 25 ]; then
                echo "::error::no free version found after 25 auto-bumps (latest beta tag: ${LATEST:-none})"
                exit 1
              fi
              echo "::warning::tag v${VERSION} already exists — auto-bumping to the next beta"
              OUT=$(node utils/scripts/bump-version.mjs --next-beta-from "$VERSION")
              VERSION=$(printf '%s' "$OUT" | sed -n 's/^version=//p')
            done
          fi
          if [ -n "$LATEST" ] && [ "v${VERSION}" != "$LATEST" ]; then
            node utils/scripts/bump-version.mjs "$VERSION" --check-only --greater-than "$LATEST"
          fi
          OUT=$(node utils/scripts/bump-version.mjs "$VERSION")
          VERSION=$(printf '%s' "$OUT" | sed -n 's/^version=//p')
          # side-by-side beta identity: id/name/versionCode (never
          # overwrites the installed stable app)
          OUT=$(node utils/scripts/apply-beta-package.mjs "$VERSION")
          VERSION=$(printf '%s' "$OUT" | sed -n 's/^version=//p')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json config.xml
          git diff --cached --quiet || git commit -m "chore(pre-release): v${VERSION}"
          # the branch may have moved since dispatch — rebase before pushing
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          # -f on the tag only ever applies in the force path (a re-point),
          # where the tag moves to the new HEAD; the branch push stays a
          # fast-forward because of the rebase
          if [ "$FORCE" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            git tag -fa "v${VERSION}" -m "XCoder Beta v${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git push -f origin "v${VERSION}"
          else
            git tag -fa "v${VERSION}" -m "XCoder Beta v${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}" "v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Add Android platform
        run: |
          # cordova-android is pinned in devDependencies; add it from
          # node_modules (deterministic) and fall back to the registry.
          # Failures must be LOUD: a masked failure here surfaces later as
          # "No platforms added to this project" from the build step.
          npx cordova platform add ./node_modules/cordova-android \
            || npx cordova platform add android@15

      - name: Prepare keystore from secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > build.json <<JSON
          {
            "android": {
              "release": {
                "keystore": "keystore.jks",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD"
              }
            }
          }
          JSON

      - name: Build web bundle
        run: |
          node utils/config.js p
          npx rspack --mode production

      - name: Build signed beta APK
        if: steps.keystore.outputs.signed == 'true'
        run: npx cordova build android --release --buildConfig build.json -- --packageType=apk

      - name: Build debug beta APK (no keystore configured)
        if: steps.keystore.outputs.signed != 'true'
        run: npx cordova build android -- --packageType=apk

      - name: Rename APK
        id: apk
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if [ -f platforms/android/app/build/outputs/apk/release/app-release.apk ]; then
            SRC=platforms/android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=platforms/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          DEST="XCoder-Beta-v${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "file=$DEST" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # previous BETA tag — stable tags must not appear as the range
          # start, otherwise stable commits leak into beta notes
          PREV=$(node utils/scripts/latest-channel-tag.mjs --beta --exclude "$TAG" || true)
          BODY=""
          if [ -n "$PREV" ]; then
            BODY=$(GITHUB_TOKEN="$GITHUB_TOKEN" node utils/scripts/generate-release-notes.js \
              "${GITHUB_REPOSITORY%%/*}" "${GITHUB_REPOSITORY##*/}" "$TAG" \
              --from-tag "$PREV" --quiet || true)
          fi
          if [ -z "$BODY" ]; then
            BODY="First pre-release of XCoder."
          fi
          {
            echo "body<<NOTES_EOF"
            printf '%s\n' "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            ### XCoder Beta ${{ steps.version.outputs.version }}

            Pre-release for testing — installs side by side with the stable
            app (package `com.carsaimz.xcoder.beta`, launcher «XCoder Beta»);
            the installed stable version is never touched.

            ${{ steps.notes.outputs.body }}

            **Instalação:** baixe o APK e permita apps de fontes desconhecidas.
            Atualizações estáveis continuam saindo como antes — esta série beta
            é atualizada com frequência e pode conter instabilidade.
