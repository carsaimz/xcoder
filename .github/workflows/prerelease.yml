name: Pre-release (debug APK)

# Debug APK automatically attached to a pre-release for beta tags
# (v1.2.3-beta.1, v2.0.0-rc.1, ...), or triggered manually with a version:
# the version is written to package.json + config.xml, committed, tagged
# (v<version>) and published with a categorized changelog.

on:
  push:
    tags:
      - "v*-beta*"
      - "v*-rc*"
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release version (e.g. 1.4.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Prepare version (manual runs bump + tag, tag push reads it)
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          set -e
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_VERSION" in
              *-beta*|*-rc*) ;;
              *) echo "::error::Pre-release version must contain -beta or -rc (e.g. 1.4.0-beta.1)"; exit 1 ;;
            esac
            OUT=$(node utils/scripts/bump-version.mjs "$INPUT_VERSION")
            VERSION=$(printf '%s' "$OUT" | sed -n 's/^version=//p')
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json config.xml
            git commit -m "chore(pre-release): v${VERSION}"
            git tag -a "v${VERSION}" -m "XCoder v${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}" "v${VERSION}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Add Android platform
        run: npx cordova platform add android@15 || true

      - name: Build web bundle + debug APK
        run: |
          node utils/config.js d
          npx rspack --mode development
          npx cordova build android -- --packageType=apk

      - name: Rename APK
        id: apk
        run: |
          VERSION=${{ steps.version.outputs.version }}
          SRC=platforms/android/app/build/outputs/apk/debug/app-debug.apk
          DEST="XCoder-v${VERSION}-debug.apk"
          cp "$SRC" "$DEST"
          echo "file=$DEST" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          BODY=""
          if [ -n "$PREV" ]; then
            BODY=$(GITHUB_TOKEN="$GITHUB_TOKEN" node utils/scripts/generate-release-notes.js \
              "${GITHUB_REPOSITORY%%/*}" "${GITHUB_REPOSITORY##*/}" "$TAG" \
              --from-tag "$PREV" --important-only --quiet || true)
          fi
          if [ -z "$BODY" ]; then
            BODY="First pre-release of XCoder."
          fi
          {
            echo "body<<NOTES_EOF"
            printf '%s\n' "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            ### XCoder ${{ steps.version.outputs.version }} (pre-release)

            Debug build for early testing. Not signed with a release key.

            ${{ steps.notes.outputs.body }}

            **Install:** download the APK and allow installation from unknown sources.
