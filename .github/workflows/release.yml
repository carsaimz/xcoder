name: Release (signed APK + AAB)

# Stable release — MANUAL ONLY, dispatched from the Actions UI.
#
# Manual run with a version (e.g. 1.4.0):
#   1. bumps package.json + config.xml (versionCode) to that version
#   2. commits "chore(release): vX.Y.Z" and creates the vX.Y.Z tag
#   3. builds a signed APK and a signed AAB (keystore from secrets)
#   4. publishes the GitHub release with a categorized changelog
#      (feat/fix/perf/refactor sections) plus GitHub's auto notes
#
# A version is NEVER released twice: re-dispatching an existing tag
# fails unless «force» is ticked (re-points the tag to the current HEAD
# and rebuilds). Leaving the version empty auto-increments from the
# latest tag (1.8.45 -> 1.8.46). Beta versions are rejected here — the
# stable channel is this workflow, pre-releases run prerelease.yml.
#
# Required secrets:
#   KEYSTORE_BASE64    - base64 of the release keystore (.jks)
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias
#   KEY_PASSWORD       - key password

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to release (e.g. 1.8.46). Empty = auto-increment"
        required: false
        type: string
      force:
        description: "Re-point an existing tag to current HEAD and rebuild"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Prepare version (dispatch only; a tag is never reused silently)
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -e
          LATEST=$(git tag --sort=-v:refname | head -n 1 || true)
          if [ -z "$INPUT_VERSION" ]; then
            # empty input = auto-increment from the latest tag (1.8.44 ->
            # 1.8.45; a pending beta base is promoted first)
            OUT=$(node utils/scripts/bump-version.mjs --next-stable ${LATEST:+--latest "$LATEST"})
            VERSION=$(printf '%s' "$OUT" | sed -n 's/^version=//p')
          else
            VERSION=$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]' | sed 's/^v//')
          fi
          # pre-releases NEVER go through the stable pipeline — they would
          # ship stable-looking APK names (XCoder-vX.Y.Z-beta.apk) over the
          # beta package and flip the release's prerelease flag off. The
          # beta channel is prerelease.yml (XCoder-Beta-*.apk, side-by-side
          # package id com.carsaimz.xcoder.beta).
          case "$VERSION" in
            *-beta*|*-rc*)
              echo "::error::'$VERSION' is a pre-release — dispatch .github/workflows/prerelease.yml instead"
              exit 1
              ;;
          esac
          if [ -n "$LATEST" ] && [ "v${VERSION}" != "$LATEST" ]; then
            node utils/scripts/bump-version.mjs "$VERSION" --check-only --greater-than "$LATEST"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "::error::Tag v${VERSION} already exists — a version is never released twice. Dispatch with a HIGHER version (latest tag: ${LATEST}; empty input auto-increments), or tick «force» to re-point the tag to the current HEAD and rebuild."
              exit 1
            fi
          fi
          OUT=$(node utils/scripts/bump-version.mjs "$VERSION")
          VERSION=$(printf '%s' "$OUT" | sed -n 's/^version=//p')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # keep CHANGELOG.md in sync (section for this version, from commits)
          node utils/scripts/update-changelog.mjs "$VERSION" || true
          git add package.json config.xml CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(release): v${VERSION}"
          # the branch may have moved since dispatch (parallel fixes) —
          # rebase so the branch push stays a fast-forward
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          # -f on the tag only ever applies in the force path (a re-point);
          # the branch push itself never needs -f after the rebase
          if [ "$FORCE" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            git tag -fa "v${VERSION}" -m "XCoder v${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git push -f origin "v${VERSION}"
          else
            git tag -fa "v${VERSION}" -m "XCoder v${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}" "v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Add Android platform
        run: |
          # cordova-android is pinned in devDependencies; add it from
          # node_modules (deterministic) and fall back to the registry.
          # Failures must be LOUD: a masked failure here surfaces later as
          # "No platforms added to this project" from the build step.
          npx cordova platform add ./node_modules/cordova-android \
            || npx cordova platform add android@15

      - name: Prepare keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > build.json <<JSON
          {
            "android": {
              "release": {
                "keystore": "keystore.jks",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PASSWORD"
              }
            }
          }
          JSON

      - name: Build signed APK
        run: |
          node utils/config.js p
          npx rspack --mode production
          npx cordova build android --release --buildConfig build.json -- --packageType=apk

      - name: Build signed AAB
        run: npx cordova build android --release --buildConfig build.json -- --packageType=bundle

      - name: Collect artifacts
        id: artifacts
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp platforms/android/app/build/outputs/apk/release/app-release.apk "XCoder-v${VERSION}.apk"
          cp platforms/android/app/build/outputs/bundle/release/app-release.aab "XCoder-v${VERSION}.aab"

      - name: Generate changelog (categorized conventional commits)
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          BODY=""
          if [ -n "$PREV" ]; then
            BODY=$(GITHUB_TOKEN="$GITHUB_TOKEN" node utils/scripts/generate-release-notes.js \
              "${GITHUB_REPOSITORY%%/*}" "${GITHUB_REPOSITORY##*/}" "$TAG" \
              --from-tag "$PREV" --important-only --quiet || true)
          fi
          if [ -z "$BODY" ]; then
            BODY="Initial stable release."
          fi
          {
            echo "body<<NOTES_EOF"
            printf '%s\n' "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: |
            XCoder-v${{ steps.version.outputs.version }}.apk
            XCoder-v${{ steps.version.outputs.version }}.aab
          body: |
            ### XCoder ${{ steps.version.outputs.version }}

            ${{ steps.notes.outputs.body }}

            ---

            **Install (Android 8+):**
            - `XCoder-v${{ steps.version.outputs.version }}.apk` — install directly
            - `XCoder-v${{ steps.version.outputs.version }}.aab` — for Play Store distribution

            Both artifacts are signed with the release key.

      - name: Cleanup sensitive files
        if: always()
        run: rm -f keystore.jks build.json
