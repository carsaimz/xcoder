# Dependabot — daily dependency checks (restored by request).
# Scans run on every new push via the CodeQL workflow (codeql.yml, daily
# cron) and dependency-review.yml (on pull requests).
version: 2
updates:
  # npm dependencies (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Africa/Maputo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # major bumps are reviewed manually (editor core deps)
      dependency-name: "*"
      update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:30"
      timezone: "Africa/Maputo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
