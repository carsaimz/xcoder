version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # TS APIs are pinned in src/cm/lsp workers; major bumps need code changes
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # LSP type packages must stay in lockstep (nested copy under
      # vscode-languageserver-protocol causes TS2322 dual-type errors)
      - dependency-name: "vscode-languageserver-types"
      - dependency-name: "vscode-languageserver-protocol"
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
      dev-tools:
        dependency-type: "development"
    labels:
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
