# Dependabot — daily dependency checks (restored by request).
# npm minor/patch updates are ALSO collected weekly by deps-update.yml
# (one tested PR); Dependabot covers npm + github-actions and groups
# action bumps into a single PR. Major npm bumps stay manual by design.
# NOTE: closing a Dependabot PR suppresses that exact update until the
# target version changes — merge it (or leave it open) instead of
# closing it.
version: 2
updates:
  # npm dependencies (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Africa/Maputo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # major bumps are reviewed manually (editor core deps)
      dependency-name: "*"
      update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:30"
      timezone: "Africa/Maputo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      ci-actions:
        patterns:
          - "*"
