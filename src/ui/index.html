<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="description" content="XCoder — mobile-first code editor and IDE" />
  <title>XCoder</title>
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/xterm.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <button id="btn-menu" class="icon-btn" aria-label="Toggle sidebar"></button>
      <div id="titlebar-title"><span class="brand-accent">X</span>Coder</div>
      <div id="titlebar-actions">
        <button id="btn-run" class="icon-btn" aria-label="Run" title="Run"></button>
        <button id="btn-kebab" class="icon-btn" aria-label="Menu" title="Menu"></button>
      </div>
    </header>

    <div id="main">
      <div id="editor-area">
        <div id="tabs" role="tablist"></div>
        <div id="editor-container"></div>
        <div id="welcome">
          <div class="welcome-logo">X</div>
          <h1><span class="brand-accent">X</span>Coder</h1>
          <p class="welcome-sub">Mobile-first code editor · CodeMirror 6</p>
          <div class="welcome-actions">
            <button id="welcome-open" class="btn btn-primary">New file</button>
            <button id="welcome-palette" class="btn btn-secondary">Commands</button>
            <button id="welcome-terminal" class="btn btn-secondary">Terminal</button>
          </div>
          <div id="welcome-recents" class="welcome-recents"></div>
          <div class="welcome-keys">
            <span><kbd>Ctrl</kbd>+<kbd>P</kbd> quick open</span>
            <span><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> commands</span>
            <span><kbd>Ctrl</kbd>+<kbd>S</kbd> save</span>
          </div>
        </div>
      </div>

      <div id="terminal-panel" class="hidden">
        <div id="terminal-header">
          <span class="section-label">Terminal</span>
          <span class="spacer"></span>
          <button id="btn-term-new" class="icon-btn small" title="New terminal"></button>
          <button id="btn-term-close" class="icon-btn small" title="Close panel"></button>
        </div>
        <div id="terminal-tabs"></div>
        <div id="terminal-body"></div>
      </div>

      <footer id="quicktools">
        <div id="qt-search"></div>
        <div id="qt-row"></div>
      </footer>
    </div>
  </div>

  <aside id="sidebar">
    <nav id="sidebar-rail">
      <button id="rail-files" class="rail-btn active" aria-label="Files" title="Files"></button>
      <button id="rail-search" class="rail-btn" aria-label="Search in files" title="Search in files"></button>
      <button id="btn-ai" class="rail-btn" aria-label="AI agents" title="AI agents"></button>
      <span class="rail-spacer"></span>
      <button id="btn-settings" class="rail-btn" aria-label="Settings" title="Settings"></button>
    </nav>
    <div id="sidebar-panels">
      <section id="panel-files" class="sidebar-panel active">
        <div id="sidebar-header">
          <span class="section-label">Files</span>
          <span class="spacer"></span>
          <button id="btn-new-file" class="icon-btn small" title="New file"></button>
          <button id="btn-new-folder" class="icon-btn small" title="New folder"></button>
          <button id="btn-refresh" class="icon-btn small" title="Refresh"></button>
        </div>
        <div id="file-tree" role="tree"></div>
      </section>
      <section id="panel-search" class="sidebar-panel">
        <div id="sidebar-header">
          <span class="section-label">Search in files</span>
          <span class="spacer"></span>
          <button id="btn-sif-clear" class="icon-btn small" title="Clear results"></button>
        </div>
        <div id="sif-results" class="sif-results"></div>
      </section>
    </div>
  </aside>
  <div id="sidebar-backdrop"></div>

  <div id="palette-overlay" class="hidden">
    <div id="palette" role="combobox" aria-expanded="true">
      <input id="palette-input" type="text" autocomplete="off" spellcheck="false" />
      <ul id="palette-list"></ul>
    </div>
  </div>

  <div id="settings-overlay" class="hidden">
    <div id="settings-page">
      <div id="settings-header">
        <button id="btn-settings-close" class="icon-btn" aria-label="Back"></button>
        <h2>Settings</h2>
      </div>
      <div id="settings-body"></div>
    </div>
  </div>

  <div id="plugin-pages" class="plugin-pages">
    <div class="plugin-pages-header">
      <h2 id="plugin-pages-title">Plugin</h2>
      <span class="spacer"></span>
      <button class="icon-btn plugin-pages-close" aria-label="Close"></button>
    </div>
    <div id="plugin-pages-body"></div>
  </div>

  <div id="ai-overlay" class="hidden"></div>

  <div id="dialog-root"></div>
  <div id="toast-container" role="status" aria-live="polite"></div>

  <script src="js/xcoder.js"></script>
</body>
</html>
