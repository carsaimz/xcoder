[default]
check-filename = true

[files]
extend-exclude = [
    "node_modules",
    "www",
    "*.yaml",
    ".vscode",
    "fastlane",
    "hooks",
    "*.gradle",
    "plugins",
    "platforms",
    # --- locales (não-inglês: typos só tem dicionários en) ---
    "src/lang/ar-ye.json",
    "src/lang/be-by.json",
    "src/lang/bn-bd.json",
    "src/lang/cs-cz.json",
    "src/lang/de-de.json",
    "src/lang/es-sv.json",
    "src/lang/fr-fr.json",
    "src/lang/hi-in.json",
    "src/lang/hu-hu.json",
    "src/lang/id-id.json",
    "src/lang/ir-fa.json",
    "src/lang/it-it.json",
    "src/lang/ja-jp.json",
    "src/lang/ko-kr.json",
    "src/lang/ml-in.json",
    "src/lang/mm-unicode.json",
    "src/lang/mm-zawgyi.json",
    "src/lang/pl-pl.json",
    "src/lang/pt-br.json",
    "src/lang/pu-in.json",
    "src/lang/ru-ru.json",
    "src/lang/tl-ph.json",
    "src/lang/tr-tr.json",
    "src/lang/uk-ua.json",
    "src/lang/uz-uz.json",
    "src/lang/vi-vn.json",
    "src/lang/zh-cn.json",
    "src/lang/zh-hant.json",
    "src/lang/zh-tw.json",
    # --- arquivos gerados (nomes de glifos de fontes / registry com prose pt+en) ---
    "src/res/iconNames.json",
    "src/res/plugin-registry.json",
    # --- conteúdo primário em pt-br (o typos não sabe português; v1.4.19+) ---
    # v1.6.2: os MDs principais viraram BILÍNGUES (secção pt + secção en no
    # mesmo ficheiro) — o dicionário do typos (só en) sinalizaria palavras
    # portuguesas legítimas nas secções pt, então ficam excluídos como os
    # outros conteúdos pt-br
    "wiki",
    "README.md",
    "ROADMAP.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "CHANGELOG.md",
    "docs/ADS.md",
    "docs/ICONS.md",
    "docs/README.md",
    "docs/github-oauth-app.md",
    "docs/screenshots",
    "scripts/add_cmd_translations.mjs",
]

