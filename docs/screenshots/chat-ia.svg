<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <!-- XCoder — mockup ilustrativo: chat IA com ações de mensagem -->
  <rect width="640" height="400" rx="18" fill="#12171d"/>
  <rect width="640" height="42" rx="18" fill="#1a222b"/>
  <rect y="24" width="640" height="18" fill="#1a222b"/>
  <text x="20" y="27" fill="#e6edf3" font-size="15" font-weight="700">IA</text>
  <text x="60" y="27" fill="#7d8b99" font-size="12">Integrado · Pollinations openai-fast</text>

  <!-- mensagem do usuário (direita, avatar pessoa) -->
  <rect x="300" y="56" width="252" height="42" rx="13" fill="#1f3a5f"/>
  <text x="314" y="74" fill="#dbeafe" font-size="12.5">Como uso o Git no XCoder?</text>
  <text x="314" y="90" fill="#9fb6d9" font-size="10.5">14:02</text>
  <circle cx="578" cy="77" r="14" fill="#28425f"/><text x="571" y="82" fill="#cfe3ff" font-size="13">👤</text>

  <!-- resposta da IA (esquerda, avatar bot) -->
  <circle cx="42" cy="132" r="14" fill="#2b8cf0"/><text x="35" y="137" fill="#fff" font-size="13">🤖</text>
  <rect x="68" y="58" width="484" height="150" rx="0" fill="none"/>
  <g font-size="12.5" fill="#dbe6f0">
    <text x="72" y="122" font-weight="700" fill="#e6edf3">Passos rápidos:</text>
    <text x="72" y="144">1. Abra a aba Git na barra lateral;</text>
    <text x="72" y="166">2. Escolha as mudanças e escreva a mensagem;</text>
    <text x="72" y="188">3. Toque em Commit — e Push para enviar.</text>
    <text x="72" y="210" fill="#7bd9a2">O token fica só no seu dispositivo (ghAuth).</text>
  </g>

  <!-- menu de contexto (pressionar longo) -->
  <rect x="120" y="240" width="212" height="132" rx="10" fill="#1c242e" stroke="#31404f"/>
  <text x="136" y="264" fill="#e6edf3" font-size="12.5">📋  Copiar</text>
  <text x="136" y="288" fill="#e6edf3" font-size="12.5">🔁  Regenerar</text>
  <text x="136" y="312" fill="#e6edf3" font-size="12.5">🔍  Detalhar</text>
  <text x="136" y="336" fill="#e6edf3" font-size="12.5">📝  Resumir</text>
  <text x="136" y="360" fill="#e6edf3" font-size="12.5">➜   Inserir no editor</text>

  <!-- composer: input em cima, botões embaixo -->
  <rect x="16" y="306" width="452" height="40" rx="14" fill="#0d1117" stroke="#31404f"/>
  <text x="30" y="330" fill="#5b6b7b" font-size="12.5">Pergunte sobre o projeto…</text>
  <rect x="16" y="356" width="452" height="34" rx="10" fill="#10161c"/>
  <circle cx="38" cy="373" r="13" fill="#1c242e"/><text x="32" y="378" fill="#9fb0c0" font-size="12">＋</text>
  <circle cx="432" cy="373" r="14" fill="#2b8cf0"/>
  <path d="M426 368l13 5-13 5 3-5z" fill="#fff"/>
</svg>
